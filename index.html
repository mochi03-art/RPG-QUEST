<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RPG QUEST</title>
<style>
  :root { --bg-color: #000; --text-color: #fff; --border-color: #fff; }
  * { box-sizing: border-box; user-select: none; font-family: "Courier New", monospace; }
  body { margin: 0; padding: 0; background-color: #222; color: var(--text-color); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  #app { width: 100vw; height: calc(100vw * 16 / 9); max-width: 50vh; max-height: 100vh; aspect-ratio: 9 / 16; background-color: var(--bg-color); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,1); overflow: hidden; }
  @media (min-aspect-ratio: 9/16) { #app { height: 100vh; width: calc(100vh * 9 / 16); } }
  #fade-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; opacity: 0; pointer-events: none; transition: opacity 0.5s; z-index: 100; }
  #fade-overlay.active { opacity: 1; pointer-events: auto; }
  #transition-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 90; display: none; pointer-events: none; image-rendering: pixelated; }
  #game-display { flex: 6; position: relative; overflow: hidden; background-color: var(--bg-color); }
  .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; padding: 10px; }
  .screen.active { display: flex; }
  #title-screen, #name-input-screen { align-items: center; justify-content: center; }
  h1 { font-size: 32px; margin-bottom: 40px; text-align: center; }
  .menu-item { font-size: 18px; margin: 8px 0; cursor: pointer; position: relative; padding-left: 20px;}
  .menu-item:before { content: " "; position: absolute; left: 0; }
  .menu-item.selected:before { content: "▶"; }
  input[type="text"] { background: var(--bg-color); color: var(--text-color); border: 2px solid var(--border-color); font-size: 20px; padding: 10px; width: 80%; text-align: center; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  .ui-window { background: rgba(0,0,0,0.9); border: 2px solid var(--border-color); padding: 10px; font-size: 15px; line-height: 1.5; z-index: 20; display: none; }
  #message-window { position: absolute; bottom: 20px; left: 10px; right: 10px; height: 100px; }
  #message-window.active { display: block; }
  #shop-window { position: absolute; top: 10px; left: 10px; right: 10px; bottom: 130px; display: none; flex-direction: column; z-index: 30; }
  #shop-window.active { display: flex; }
  #shop-list { flex: 1; overflow-y: auto; margin-top: 10px; border-top: 1px solid #fff; padding-top: 10px; }
  #confirm-window { position: absolute; bottom: 130px; right: 10px; z-index: 40; min-width: 100px; display: none; flex-direction: column; }
  #confirm-window.active { display: flex; }
  #battle-screen { padding: 0; height: 100%; min-height: 0; }
  #battle-top { flex: 1 1 auto; min-height: 0; display: flex; position: relative; padding: 10px; }
  #player-status-window { border: 2px solid var(--border-color); padding: 10px; width: 120px; position: absolute; top: 10px; left: 10px; font-size: 14px; background: rgba(0,0,0,0.8); z-index: 5; }
  #enemy-area { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #enemy-img { width: 100px; height: 100px; flex-shrink: 0; background-color: var(--text-color); color: var(--bg-color); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 24px; }
  #battle-log { flex: 0 0 35%; min-height: 0; max-height: 35%; border-top: 2px solid var(--border-color); padding: 10px; overflow-y: auto; font-size: 14px; line-height: 1.4; }
  #battle-commands { position: absolute; bottom: 10px; right: 10px; border: 2px solid var(--border-color); background: var(--bg-color); padding: 10px; z-index: 10; }
  #battle-sub-window { position: absolute; bottom: 10px; right: 130px; border: 2px solid var(--border-color); background: var(--bg-color); padding: 10px; min-width: 120px; z-index: 10; }
  #menu-screen { flex-direction: column; }
  .menu-box { border: 2px solid var(--border-color); padding: 10px; margin: 5px; }
  #menu-main { flex: 1; }
  #menu-details { flex: 2; display: flex; flex-direction: column; overflow-y: auto; }
  #controls-area { flex: 4; position: relative; background-color: #111; border-top: 2px solid var(--border-color); }
  #btn-menu { position: absolute; top: 15px; right: 15px; border: 2px solid var(--border-color); background: var(--bg-color); color: var(--text-color); padding: 5px 15px; border-radius: 5px; font-size: 14px; }
  #d-pad { position: absolute; bottom: 20px; left: 15px; width: 130px; height: 130px; }
  .d-btn { position: absolute; background: var(--bg-color); border: 2px solid var(--border-color); color: var(--text-color); font-size: 20px; font-weight: bold; width: 45px; height: 45px; text-align: center; line-height: 41px; border-radius: 5px; }
  #btn-up { top: 0; left: 42.5px; } #btn-down { bottom: 0; left: 42.5px; }
  #btn-left { top: 42.5px; left: 0; } #btn-right { top: 42.5px; left: 85px; }
  #action-btns { position: absolute; bottom: 25px; right: 20px; width: 110px; height: 110px; }
  .a-btn { position: absolute; background: var(--bg-color); border: 2px solid var(--border-color); color: var(--text-color); width: 50px; height: 50px; border-radius: 25px; text-align: center; line-height: 46px; font-size: 16px; font-weight: bold; }
  #btn-cancel { bottom: 0; left: 0; } #btn-ok { top: 0; right: 0; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .anim-blink { animation: blink 0.2s 3; }
  @keyframes shake-red { 0%, 100% { transform: translate(0, 0); background-color: var(--bg-color); } 25%, 75% { transform: translate(-5px, 0); background-color: #500; } 50% { transform: translate(5px, 0); background-color: #500; } }
  .anim-damage { animation: shake-red 0.4s; }
  @keyframes shake-critical { 
  0%, 100% { transform: translate(0, 0) scale(1); filter: none; } 
  20%, 60% { transform: translate(-10px, 0) scale(1.1); filter: drop-shadow(0 0 10px #f00) drop-shadow(0 0 5px #f00); } 
  40%, 80% { transform: translate(10px, 0) scale(1.1); filter: drop-shadow(0 0 10px #ff0) drop-shadow(0 0 5px #ff0); } 
}
  .anim-critical { animation: shake-critical 0.5s; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="fade-overlay"></div>
  <div id="game-display">
    <canvas id="transition-canvas"></canvas>
    <div id="title-screen" class="screen active">
      <h1>RPG QUEST</h1>
      <div class="menu-item selected" id="ts-new">はじめから</div>
      <div class="menu-item" id="ts-continue" style="display: none;">つづきから</div>
    </div>
    <div id="name-input-screen" class="screen">
      <p style="text-align:center;">なまえを いれてください</p>
      <input type="text" id="player-name-input" maxlength="6" value="ゆうしゃ">
      <p style="font-size:12px; margin-top:20px; text-align:center;">決定ボタン(右下)で進む</p>
    </div>
    <div id="field-screen" class="screen" style="padding:0;">
      <canvas id="game-canvas"></canvas>
      <div id="message-window" class="ui-window"><div id="message-text"></div><div style="position:absolute; bottom:5px; right:10px; font-size:12px;">▼</div></div>
      <div id="shop-window" class="ui-window">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;"><div id="shop-msg" style="flex:1;"></div><div style="text-align:right;">所持金: <span id="shop-gold">0</span> G</div></div>
        <div id="shop-list"></div>
      </div>
      <div id="confirm-window" class="ui-window"><div class="menu-item selected" id="conf-yes">はい</div><div class="menu-item" id="conf-no">いいえ</div></div>
    </div>
    <div id="battle-screen" class="screen">
      <div id="battle-top">
        <div id="player-status-window"><div id="b-name">--</div><div>LV: <span id="b-lv"></span></div><div>HP: <span id="b-hp"></span></div><div>MP: <span id="b-mp"></span></div></div>
        <div id="enemy-area"><div id="enemy-img">敵</div></div>
        <div id="battle-commands" class="hidden"><div class="menu-item selected">たたかう</div><div class="menu-item">じゅもん</div><div class="menu-item">どうぐ</div><div class="menu-item">ぼうぎょ</div><div class="menu-item">にげる</div></div>
        <div id="battle-sub-window" class="hidden"></div>
      </div>
      <div id="battle-log"></div>
    </div>
    <div id="menu-screen" class="screen">
      <div class="menu-box" id="menu-main"><div class="menu-item selected">つよさ</div><div class="menu-item">そうび</div><div class="menu-item">どうぐ</div><div class="menu-item">じゅもん</div><div class="menu-item" style="margin-top:10px;">セーブ</div><div class="menu-item" style="margin-top:10px;">タイトルへもどる</div></div>
      <div class="menu-box hidden" id="menu-details"></div>
    </div>
  </div>
  <div id="controls-area">
    <div id="btn-menu">メニュー</div>
    <div id="d-pad"><div class="d-btn" id="btn-up">▲</div><div class="d-btn" id="btn-left">◀</div><div class="d-btn" id="btn-right">▶</div><div class="d-btn" id="btn-down">▼</div></div>
    <div id="action-btns"><div class="a-btn" id="btn-cancel">✖</div><div class="a-btn" id="btn-ok">〇</div></div>
  </div>
</div>

let currentBGM = null;
let currentBGMName = null;

function playBGM(bgmName, isLoop = true) { // 変更: 第2引数でループ指定(初期値true)
  if (currentBGMName === bgmName && currentBGM && !currentBGM.paused) return;
  stopBGM();
  if (AUDIO_ASSETS.BGM[bgmName]) {
    currentBGM = new Audio(AUDIO_ASSETS.BGM[bgmName]);
    currentBGM.loop = isLoop;  // 変更: 引数に従ってループ設定を適用
    currentBGM.volume = 0.4;
    currentBGM.play().catch(e => console.warn("BGM再生待機中"));
    currentBGMName = bgmName;
  }
}
// BGMを停止する関数
function stopBGM() {
  if (currentBGM) {
    currentBGM.pause();
    currentBGM.currentTime = 0;
    currentBGM = null;
    currentBGMName = null;
  }
}

// SE（効果音）を再生する関数
function playSE(seName) {
  if (AUDIO_ASSETS.SE[seName]) {
    // 連続で鳴らせるように、毎回新しい音声オブジェクトを作る
    let se = new Audio(AUDIO_ASSETS.SE[seName]);
    se.volume = 0.6; // SEの音量 (0.0 〜 1.0)
    se.play().catch(e => {}); 
  }
}

 // マップの情報をもとにBGMを切り替える関数を追加

  if (mapObj && mapObj.bgm) {
    playBGM(mapObj.bgm);
  } else {
    // 固有の指定がない場合は、マップID(名前)からBGMを自動推測
    if (currentMapId.includes('town')) {
      playBGM('town');
    } else if (currentMapId.includes('castle')) {
      playBGM('castle');
    } else if (currentMapId.includes('cave')) {
      playBGM('cave');
    } else {
      // 該当しない場合はデフォルトのフィールドBGM
      playBGM('field');
    }
  }
}

function generateMap() {
  if (CUSTOM_MAPS && Object.keys(CUSTOM_MAPS).length > 0) {
    mapsData = CUSTOM_MAPS;
  } else {
    mapsData = { "world": { width: 40, height: 40, encounter: true, data: [], events: {}, npcs: {} }, "town": { width: 15, height: 15, encounter: false, data: [], events: {}, npcs: {} } };
    for(let y=0; y<40; y++){ let r=[]; for(let x=0; x<40; x++){ r.push((x===0||y===0||x===39||y===39)?2:(Math.random()<0.1?1:0)); } mapsData["world"].data.push(r); }
    mapsData["world"].data[20][20] = 3; mapsData["world"].events[`20,20`] = { targetMap: "town", targetX: 7, targetY: 13 };
    for(let y=0; y<15; y++){ let r=[]; for(let x=0; x<15; x++) { r.push((x===0||y===0||x===14||y===14)?8:0); } mapsData["town"].data.push(r); }
    mapsData["town"].data[11][5] = 9; mapsData["town"].data[11][6] = 9; mapsData["town"].data[12][6] = 9;
    
    mapsData["town"].events[`7,14`] = { targetMap: "world", targetX: 20, targetY: 21 };
    mapsData["town"].npcs[`7,6`] = { type: "king", text: "勇者よ、よくぞ戻ってきた。\\n健闘を祈るぞ！---さあ、行くがよい！" };
    mapsData["town"].npcs[`5,5`] = { type: "weapon_shop", text: "武器屋だよ。", items: ["たけざお", "こんぼう"] };
    mapsData["town"].npcs[`9,5`] = { type: "inn", text: "旅の宿屋へようこそ。", price: 10 };
    mapsData["town"].npcs[`3,3`] = { type: "treasure", item: "いのちのきのみ" };
  }
}

function getSpawnPoint() {
  for (const mId in mapsData) {
    const npcs = mapsData[mId].npcs;
    for (const key in npcs) {
      if (npcs[key].type === 'king') {
        const [x, y] = key.split(',').map(Number);
        const spawnY = (y + 1 < mapsData[mId].height) ? y + 1 : y;
        return { mapId: mId, x: x, y: spawnY };
      }
    }
  }
  return { mapId: Object.keys(mapsData)[0], x: Math.floor(mapsData[Object.keys(mapsData)[0]].width/2), y: Math.floor(mapsData[Object.keys(mapsData)[0]].height/2) };
}

function getSafeWarpPos(mapId, tx, ty) {
    const map = mapsData[mapId];
    if(!map) return {x: tx, y: ty};
    const dirs = [[0,1], [0,-1], [-1,0], [1,0]];
    for(let [dx, dy] of dirs) {
        let nx = tx + dx, ny = ty + dy;
        if(nx>=0 && nx<map.width && ny>=0 && ny<map.height) {
            let t = map.data[ny][nx]; let info = TILE_DB[t];
            if(info && info.passable && !map.events[`${nx},${ny}`]) return {x: nx, y: ny};
        }
    }
    return {x: tx, y: ty};
}

function getRulaTargets() {
    let targets = []; let seen = new Set();
    for (let mId in mapsData) {
        let map = mapsData[mId];
        for (let key in map.events) {
            let ev = map.events[key];
            let [ex, ey] = key.split(',').map(Number);
            let tile = map.data[ey][ex];
            if (tile === 3 || tile === 4 || tile === 5) {
                let tName = tile === 3 ? "町" : (tile === 4 ? "城" : "洞窟");
                let dispName = `${tName} (${ev.targetMap})`;
                if (!seen.has(dispName)) {
                    let wp = getSafeWarpPos(mId, ex, ey);
                    targets.push({ name: dispName, mapId: mId, x: wp.x, y: wp.y });
                    seen.add(dispName);
                }
            }
        }
    }
    return targets;
}

function resetPlayer() {
  generateMap();
  const spawn = getSpawnPoint();
  currentMapId = spawn.mapId;
  player = {
    name: "", level: 1, exp: 0, gold: 100, hp: 20, maxHp: 20, mp: 5, maxMp: 5,
    str: 5, def: 5, agi: 5, int: 5, luck: 5, x: spawn.x, y: spawn.y, dir: 'down', stepCount: 0,
    // ▼ スプレッド構文(...)を使ってITEM_DBから直接データを展開し、countを付与するよう変更
    equipment: { 
      weapon: { ...ITEM_DB["たけざお"], count: 1 }, 
      shield: null, 
      helmet: null, 
      armor: { ...ITEM_DB["ぬののふく"], count: 1 } 
    },
    // ▼ やくそうも同様に変更
    inventory: [ { ...ITEM_DB["やくそう"], count: 3 } ],
    spells: [], opened: [],
    status: { poison: false, sleep: 0, confuse: 0, seal: 0 }
  };
}

function switchState(newState) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  currentState = newState;
  
  // ★追加: 状態に応じたBGMの再生
  if (newState === GAME_STATE.TITLE) { 
    playBGM('title'); 
  } else if ([GAME_STATE.FIELD, GAME_STATE.MESSAGE, GAME_STATE.SHOP, GAME_STATE.CONFIRM, GAME_STATE.MENU].includes(newState)) {
    // 固定の'field'ではなく、現在いるマップに応じたBGMを流す
    playFieldBGM();
  }

  if (newState === GAME_STATE.TITLE) { document.getElementById('title-screen').classList.add('active'); updateScreen(); }
  if (newState === GAME_STATE.NAME_INPUT) document.getElementById('name-input-screen').classList.add('active');
  if ([GAME_STATE.FIELD, GAME_STATE.MESSAGE, GAME_STATE.SHOP, GAME_STATE.CONFIRM].includes(newState)) { document.getElementById('field-screen').classList.add('active'); drawField(); }
  // ...以降省略...
  if (newState === GAME_STATE.BATTLE) document.getElementById('battle-screen').classList.add('active');
  if (newState === GAME_STATE.MENU) { document.getElementById('menu-screen').classList.add('active'); updateMenuUI(); }
}

function updateScreen() {
  if (currentState === GAME_STATE.TITLE) {
    const hasData = hasSaveData();
    document.getElementById('ts-continue').style.display = hasData ? 'block' : 'none';
    if (!hasData) uiSelections.title = 0;
    document.getElementById('ts-new').classList.toggle('selected', uiSelections.title === 0);
    document.getElementById('ts-continue').classList.toggle('selected', uiSelections.title === 1);
  } else if (currentState === GAME_STATE.BATTLE) {
    const cmds = document.getElementById('battle-commands').children;
    for(let i=0; i<cmds.length; i++) cmds[i].classList.toggle('selected', i === uiSelections.battle);
    const subWin = document.getElementById('battle-sub-window');
    if (battleMenuState !== 'main' && battleMenuState !== 'end') { subWin.classList.remove('hidden'); updateBattleSubWindow(); } else { subWin.classList.add('hidden'); }
  }
}

function updateBattleSubWindow() {
  const subWin = document.getElementById('battle-sub-window'); subWin.innerHTML = '';
  let list = battleMenuState === 'magic' ? player.spells : player.inventory.map(i => i.name + " x" + i.count);
  if (list.length === 0) list = ["(なし)"];
  list.forEach((name, index) => {
    const div = document.createElement('div'); div.className = 'menu-item' + (index === uiSelections.battleSub && name !== "(なし)" ? ' selected' : '');
    div.innerText = name; subWin.appendChild(div);
  });
}

function drawField() {
  if (![GAME_STATE.FIELD, GAME_STATE.MESSAGE, GAME_STATE.SHOP, GAME_STATE.CONFIRM].includes(currentState)) return;
  const mapObj = mapsData[currentMapId];
  const offsetX = player.x * TILE_SIZE - (canvas.width / 2) + (TILE_SIZE / 2);
  const offsetY = player.y * TILE_SIZE - (canvas.height / 2) + (TILE_SIZE / 2);

  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < mapObj.height; y++) {
    for (let x = 0; x < mapObj.width; x++) {
      const screenX = Math.floor(x * TILE_SIZE - offsetX);
      const screenY = Math.floor(y * TILE_SIZE - offsetY);
      if (screenX < -TILE_SIZE || screenX > canvas.width || screenY < -TILE_SIZE || screenY > canvas.height) continue;

      const tile = mapObj.data[y][x];
      const imgKey = 'tile_' + tile;
      const tileInfo = TILE_DB[tile] || TILE_DB[0];
      
      // ▼ 修正: mapObj.baseData を mapObj.bgData に変更
      let baseTileId = null;
      if (mapObj.bgData && mapObj.bgData[y] && mapObj.bgData[y][x] !== undefined) {
        // マップエディタで設定された下地タイルIDを取得（-1などで「下地なし」を表現可能）
        baseTileId = mapObj.bgData[y][x];
      } else if (tile !== 0 && tile !== 4 && tile !== 10) {
        // 既存のマップデータ用のフォールバック（デフォルト下地: 平地）
        baseTileId = 0; 
      }

      // 下地タイルが設定されており、かつ有効なIDの場合のみ描画
      if (baseTileId !== null && baseTileId !== -1) {
        const baseImgKey = 'tile_' + baseTileId;
        const baseImg = loadedImages[baseImgKey];
        const baseInfo = TILE_DB[baseTileId] || TILE_DB[0];

        if (baseImg && baseImg.isLoaded) {
          ctx.drawImage(baseImg, screenX, screenY, TILE_SIZE, TILE_SIZE);
        } else {
          ctx.fillStyle = baseInfo.color; 
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
        }
      }

      if (loadedImages[imgKey] && loadedImages[imgKey].isLoaded) {
        ctx.drawImage(loadedImages[imgKey], screenX, screenY, TILE_SIZE, TILE_SIZE);
      } else {
        ctx.fillStyle = tileInfo.color; ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
        if (tileInfo.label) { ctx.fillStyle = "#fff"; ctx.fillText(tileInfo.label, screenX+8, screenY+20); }
        else { ctx.strokeStyle = "#444"; ctx.strokeRect(screenX, screenY, TILE_SIZE, TILE_SIZE); }
      }

      if (mapObj.npcs[`${x},${y}`]) {
        const npc = mapObj.npcs[`${x},${y}`];
        const objKey = `${currentMapId}_${x}_${y}`;
        const isOpened = player.opened && player.opened.includes(objKey);
        
        const npcDef = NPC_DB[npc.type] || NPC_DB['talk'];

        // ▼ 追加: オブジェクトかつ入手済み(開封済み)の場合はここでスキップし、非表示にする
        if (npcDef.isObject && isOpened) {
            continue; 
        }

        const targetImgKey = npc.imgKey || npcDef.imgKey;
        const targetImg = targetImgKey ? loadedImages[targetImgKey] : null;

        // ▼ 変更: !npcDef.isObject の条件を削除。画像があれば描画する。
        if (targetImg && targetImg.isLoaded) {
           ctx.drawImage(targetImg, screenX, screenY, TILE_SIZE, TILE_SIZE);
        } else {
           // 画像が見つからなかった場合の予備の図形描画
           ctx.fillStyle = npcDef.color; 
           if (npcDef.isObject) {
               ctx.fillRect(screenX+4, screenY+4, TILE_SIZE-8, TILE_SIZE-8);
               ctx.fillStyle = "#fff";
           }
           ctx.fillText(npcDef.label, screenX+8, screenY+20);
        }
      }
    }
  }

  const px = canvas.width / 2 - TILE_SIZE / 2; const py = canvas.height / 2 - TILE_SIZE / 2;
  if (loadedImages['player'] && loadedImages['player'].isLoaded) ctx.drawImage(loadedImages['player'], px, py, TILE_SIZE, TILE_SIZE);
  else { ctx.fillStyle = "#fff"; ctx.fillRect(px+4, py+4, TILE_SIZE-8, TILE_SIZE-8); ctx.fillStyle = "#000"; ctx.fillText("勇", px+8, py+20); }
}

function handleDeath() {
  stopBGM(); 
  playBGM('death', false); // 追加: 敗北時のBGMを一度だけ流す


  showMessage(["あなたは しんでしまった...\\n\\n目の前が まっくらになった。"], () => {

    stopBGM();
    player.gold = Math.floor(player.gold / 2);
    player.hp = player.maxHp; player.mp = player.maxMp;
    player.status = { poison: false, sleep: 0, confuse: 0, seal: 0 };
    
    const spawn = getSpawnPoint();
    currentMapId = spawn.mapId; player.x = spawn.x; player.y = spawn.y; player.dir = 'down';
    
    switchState(GAME_STATE.FIELD);

    showMessage("王様「おお " + player.name + " よ！\\n死んでしまうとは なにごとだ！」");
  });
}

function movePlayer(dx, dy, dirStr) {
  if (currentState !== GAME_STATE.FIELD || isFading) return;
  player.dir = dirStr;
  const mapObj = mapsData[currentMapId];
  const newX = player.x + dx; const newY = player.y + dy;

  if (newX >= 0 && newX < mapObj.width && newY >= 0 && newY < mapObj.height) {
    const tile = mapObj.data[newY][newX];
    const tileInfo = TILE_DB[tile] || TILE_DB[0];
    
    // ▼ 変更箇所：NPCやオブジェクトの障害物判定
    const npc = mapObj.npcs[`${newX},${newY}`];
    let npcObstacle = !!npc; // 基本はNPCがいれば通行不可
    
    if (npc) {
      const npcDef = NPC_DB[npc.type] || NPC_DB['talk'];
      const objKey = `${currentMapId}_${newX}_${newY}`;
      const isOpened = player.opened && player.opened.includes(objKey);
      
      // オブジェクト（宝箱・壺・樽など）であり、かつ開封済みの場合は通行可能にする
      if (npcDef.isObject && isOpened) {
        npcObstacle = false;
      }
    }
    
    const isObstacle = !tileInfo.passable || npcObstacle;
    // ▲ 変更箇所ここまで
    
    if (!isObstacle) {
      player.x = newX; player.y = newY; player.stepCount++;
      
      if (mapObj.events[`${newX},${newY}`]) {
        const ev = mapObj.events[`${newX},${newY}`];
        if (mapsData[ev.targetMap]) { 
          playSE('warp'); // 追加: ワープ移動時の音を鳴らす
          isFading = true;
          document.getElementById('fade-overlay').classList.add('active');
          setTimeout(() => {
            currentMapId = ev.targetMap; 
            player.x = ev.targetX; 
            player.y = ev.targetY; 
            drawField(); 
            playFieldBGM(); // 追加: マップ移動後に新しいマップのBGMに切り替える
            document.getElementById('fade-overlay').classList.remove('active');
            setTimeout(() => { isFading = false; }, 500); 
          }, 500);
        }
        return; 
      }
      
      drawField();

      if (tileInfo.damage) {
        player.hp = Math.max(0, player.hp - tileInfo.damage);
        playSE('damage');
        const display = document.getElementById('game-display');
        display.classList.remove('anim-damage'); void display.offsetWidth; display.classList.add('anim-damage');
        if (player.hp <= 0) { setTimeout(() => handleDeath(), 500); return; }
      }

      if (player.status && player.status.poison) {
         player.hp = Math.max(0, player.hp - 1);
         playSE('damage');
         const display = document.getElementById('game-display');
         display.classList.remove('anim-damage'); void display.offsetWidth; display.classList.add('anim-damage');
         if (player.hp <= 0) { setTimeout(() => handleDeath(), 500); return; }
      }
      
      const encEnabled = mapObj.encounter !== undefined ? mapObj.encounter : (currentMapId.includes('world') || currentMapId.includes('cave'));
      if (encEnabled && player.stepCount > 5 && Math.random() < 0.1) startBattle();
      
    } else { drawField(); }
  }
}

let messageCallback = null;
let messageQueue = [];

function showMessage(msg, callback = null) {
  if (Array.isArray(msg)) messageQueue = [...msg];
  else messageQueue = msg.split('---').map(s => s.trim());
  messageCallback = callback;
  displayNextMessage();
}

function displayNextMessage() {
  if (messageQueue.length > 0) {
    const nextMsg = messageQueue.shift();
    document.getElementById('message-text').innerHTML = nextMsg.replace(/\\n|\n/g, '<br>');
    document.getElementById('message-window').classList.add('active');
    currentState = GAME_STATE.MESSAGE;
  } else {
    document.getElementById('message-window').classList.remove('active');
    if (messageCallback) { const cb = messageCallback; messageCallback = null; cb(); }
    else { switchState(GAME_STATE.FIELD); }
  }
}

let shopState = 'select'; // ★追加: 'select', 'buy', 'sell'
let currentShopItems = []; let shopCursor = 0;

function openShop(npc) {
  document.getElementById('shop-window').classList.add('active'); currentState = GAME_STATE.SHOP;
  document.getElementById('shop-msg').innerText = npc.text || "いらっしゃいませ。"; 
  document.getElementById('shop-gold').innerText = player.gold;
  currentShopItems = (npc.items || []).map(name => ITEM_DB[name] || { name: name, type: "heal", val: 10, price: 10 }).filter(i => i && (i.price !== 0 || i.type !== 'seed')); 
  shopState = 'select'; // ★初期化
  shopCursor = 0; 
  updateShopUI();
}

function updateShopUI() {
  document.getElementById('shop-gold').innerText = player.gold;
  let html = '';
  if (shopState === 'select') {
    html += `<div class="menu-item${shopCursor === 0 ? ' selected' : ''}">かう</div>`;
    html += `<div class="menu-item${shopCursor === 1 ? ' selected' : ''}">うる</div>`;
    html += `<div class="menu-item${shopCursor === 2 ? ' selected' : ''}">やめる</div>`;
  } else if (shopState === 'buy') {
    if (currentShopItems.length === 0) { html = '<div>(品切れのようだ...)</div>'; } 
    else {
      currentShopItems.forEach((item, i) => { html += `<div class="menu-item${i === shopCursor ? ' selected' : ''}" style="display:flex;"><span style="flex:1;">${item.name}</span><span>${item.price} G</span></div>`; });
      html += `<div class="menu-item${shopCursor === currentShopItems.length ? ' selected' : ''}">もどる</div>`;
    }
  } else if (shopState === 'sell') {
    let sellableItems = player.inventory.filter(i => (i.price && i.price > 0) || (i.sellPrice !== undefined && i.sellPrice > 0));
    if (sellableItems.length === 0) {
      html += `<div>(売れるものが ないようだ...)</div>`;
      html += `<div class="menu-item${shopCursor === 0 ? ' selected' : ''}">もどる</div>`;
    } else {
      sellableItems.forEach((item, i) => { 
        let sellPrice = item.sellPrice !== undefined ? item.sellPrice : Math.floor((item.price || 0) / 2); // ★売値の計算
        html += `<div class="menu-item${i === shopCursor ? ' selected' : ''}" style="display:flex;"><span style="flex:1;">${item.name} x${item.count}</span><span>${sellPrice} G</span></div>`; 
      });
      html += `<div class="menu-item${shopCursor === sellableItems.length ? ' selected' : ''}">もどる</div>`;
    }
  }
  document.getElementById('shop-list').innerHTML = html;
}
function closeShop() { document.getElementById('shop-window').classList.remove('active'); switchState(GAME_STATE.FIELD); }

function playBattleTransition(callback) {
  const tCanvas = document.getElementById('transition-canvas');
  tCanvas.style.display = 'block';
  tCanvas.width = canvas.width; tCanvas.height = canvas.height;
  const tCtx = tCanvas.getContext('2d');
  
  const cols = 16; const rows = 16;
  const bw = tCanvas.width / cols; const bh = tCanvas.height / rows;
  let blocks = [];
  
  let top = 0, bottom = rows - 1, left = 0, right = cols - 1;
  while (top <= bottom && left <= right) {
    for (let i = left; i <= right; i++) blocks.push({x: i, y: top}); top++;
    for (let i = top; i <= bottom; i++) blocks.push({x: right, y: i}); right--;
    if (top <= bottom) { for (let i = right; i >= left; i--) blocks.push({x: i, y: bottom}); bottom--; }
    if (left <= right) { for (let i = bottom; i >= top; i--) blocks.push({x: left, y: i}); left++; }
  }

  let index = 0; tCtx.fillStyle = "#000";
  
  function drawFrame() {
    let blocksPerFrame = 5;
    for(let i = 0; i < blocksPerFrame; i++) {
        if (index < blocks.length) {
            let b = blocks[index];
            tCtx.fillRect(Math.floor(b.x * bw), Math.floor(b.y * bh), Math.ceil(bw)+1, Math.ceil(bh)+1);
            index++;
        }
    }
    if (index < blocks.length) { requestAnimationFrame(drawFrame); } 
    else {
      setTimeout(() => {
        callback();
        tCanvas.style.display = 'none';
        tCtx.clearRect(0,0, tCanvas.width, tCanvas.height);
      }, 300);
    }
  }
  drawFrame();
}

let isPlayerDefending = false;
function startBattle() { 
  const mapObj = mapsData[currentMapId];
  let enemies = ["スライム", "スライムベス", "ドラキー"];
  if (mapObj.encEnemies && mapObj.encEnemies.length > 0) {
    enemies = mapObj.encEnemies;
  }
  const enemy = enemies[Math.floor(Math.random() * enemies.length)];
  startEventBattle(enemy); 
}

function startEventBattle(enemyData, isConsecutive = false) { 
  if (isFading && !isConsecutive) return;
  isFading = true;

  // ▼ 追加・変更箇所：トランジション開始前にBGMとSEを鳴らします
  if (!isConsecutive) {
    let eNameForBgm = "謎の敵";
    if (typeof enemyData === 'object') {
        eNameForBgm = enemyData.enemy || enemyData.value || eNameForBgm;
    } else if (typeof enemyData === 'string') {
        eNameForBgm = enemyData;
    }

    if (eNameForBgm.includes("りゅうおう") || eNameForBgm.includes("竜王")) {
      playBGM('boss');
    } else {
      playBGM('battle');
    }
  }
  // ▲ 追加・変更箇所ここまで

  const initBattle = () => {
    isFading = false;
    switchState(GAME_STATE.BATTLE); 
    if (!isConsecutive) player.stepCount = 0; 
    isPlayerDefending = false; battleMenuState = 'main'; 
    
    const enemyImg = document.getElementById('enemy-img');
    enemyImg.style.visibility = 'visible';
    enemyImg.classList.remove('anim-blink', 'anim-critical'); 
    document.getElementById('game-display').classList.remove('anim-damage'); 
    
    let eName = "謎の敵"; let hp=30, mp=0, atk=10, def=5, agi=5, fleeRate=0, exp=20, gold=50; let dropItem = null, dropRate = 0; let imgKey = null;
    let sleepResist = 0.5, sealResist = 0.5, confuseResist = 0.5, actions = ["こうげき"];
    let nextEnemyData = null; // ★追加: 第二形態データの保持用

    const defaultEnemy = {
      hp: 30, mp: 0, atk: 10, def: 5, agi: 5, fleeRate: 0, exp: 20, gold: 50,
      dropItem: null, dropRate: 0, imgKey: null,
      sleepResist: 0.5, sealResist: 0.5, confuseResist: 0.5, actions: ["こうげき"]
    };
    
    if (typeof enemyData === 'object') {
        eName = enemyData.enemy || enemyData.value || eName;
        // ★変更: マップエディタで設定された第二形態の情報を取得（hasForm2プロパティに対応）
        nextEnemyData = enemyData.nextEnemy || enemyData.nextForm || enemyData.secondForm || null;
        if (!nextEnemyData && enemyData.hasForm2) {
            nextEnemyData = {
                enemy: enemyData.enemy2,
                imgKey: enemyData.enemyImg2
            };
        } 
        
        if (enemyData.custom) { 
          hp=enemyData.hp; mp=enemyData.mp||0; atk=enemyData.atk; def=enemyData.def||0; agi=enemyData.agi||0; fleeRate=enemyData.fleeRate||0; exp=enemyData.exp; gold=enemyData.gold; 
          dropItem=enemyData.dropItem || null; dropRate=enemyData.dropRate || 0;
          imgKey = enemyData.imgKey || null;
          sleepResist = enemyData.sleepResist !== undefined ? enemyData.sleepResist : 0.5;
          sealResist = enemyData.sealResist !== undefined ? enemyData.sealResist : 0.5;
          confuseResist = enemyData.confuseResist !== undefined ? enemyData.confuseResist : 0.5;
          actions = enemyData.actions || ["こうげき"];
        } else {
          let edb = ENEMY_DB[eName] || defaultEnemy;
          hp = edb.hp; mp = edb.mp||0; atk = edb.atk; def = edb.def||0; agi = edb.agi||0; fleeRate = edb.fleeRate||0; exp = edb.exp; gold = edb.gold; dropItem = edb.dropItem; dropRate = edb.dropRate;
          // ★変更: ENEMY_DBの画像だけでなく、NPC(enemyData)に直接設定された画像も適用できるようにする
          imgKey = edb.imgKey || enemyData.imgKey || null;
          sleepResist = edb.sleepResist !== undefined ? edb.sleepResist : 0.5;
          sealResist = edb.sealResist !== undefined ? edb.sealResist : 0.5;
          confuseResist = edb.confuseResist !== undefined ? edb.confuseResist : 0.5;
          actions = edb.actions || ["こうげき"];
        }
    } else if (typeof enemyData === 'string') {
        eName = enemyData;
        let edb = ENEMY_DB[eName] || defaultEnemy;
        hp = edb.hp; mp = edb.mp||0; atk = edb.atk; def = edb.def||0; agi = edb.agi||0; fleeRate = edb.fleeRate||0; exp = edb.exp; gold = edb.gold; dropItem = edb.dropItem; dropRate = edb.dropRate;
        imgKey = edb.imgKey || null;
        sleepResist = edb.sleepResist !== undefined ? edb.sleepResist : 0.5;
        sealResist = edb.sealResist !== undefined ? edb.sealResist : 0.5;
        confuseResist = edb.confuseResist !== undefined ? edb.confuseResist : 0.5;
        actions = edb.actions || ["こうげき"];
    }
    
    currentEnemy = { 
      name: eName, hp: hp, maxHp: hp, mp: mp, attack: atk, def: def, agi: agi, fleeRate: fleeRate, 
      exp: exp, gold: gold, dropItem: dropItem, dropRate: dropRate, 
      sleepResist: sleepResist, sealResist: sealResist, confuseResist: confuseResist, 
      actions: actions, status: { poison: false, sleep: 0, confuse: 0, seal: 0 },
      nextEnemyData: nextEnemyData // ★追加: 生成した敵ステータスに第二形態の情報を格納
    };

    // ▼ 追加: 画像があれば敵の要素に背景画像として設定し、文字を消す
    if (imgKey && loadedImages[imgKey] && loadedImages[imgKey].isLoaded) {
      const img = loadedImages[imgKey];
      enemyImg.style.backgroundImage = `url('${img.src}')`;
      enemyImg.style.backgroundSize = '100% 100%'; 
      enemyImg.style.backgroundRepeat = 'no-repeat';
      enemyImg.style.backgroundPosition = 'center';
      enemyImg.style.backgroundColor = 'transparent';
      
      // ▼ 画像の本来のサイズを取得し、要素のサイズとして設定する
      const scale = 2; // デフォルトで2倍表示。原寸大が良い場合は1に変更してください
      enemyImg.style.width = (img.width * scale) + 'px';
      enemyImg.style.height = (img.height * scale) + 'px';
      enemyImg.style.imageRendering = 'pixelated'; // 拡大時にドット感を保つ
      
      enemyImg.innerText = "";
    } else {
      enemyImg.style.backgroundImage = 'none';
      enemyImg.style.backgroundColor = 'var(--text-color)';
      // ▼ 画像がない場合はデフォルトの100x100サイズに戻す
      enemyImg.style.width = '100px';
      enemyImg.style.height = '100px';
      enemyImg.innerText = "敵";
    }

    updateBattleStatus();
    
    const log = document.getElementById('battle-log'); 

    // ★変更: 連戦時はログを区切って前の情報を残す
    if (isConsecutive) {
        log.innerHTML += `<hr style="border-color: #555; margin: 10px 0;"><p>${currentEnemy.name} が あらわれた！</p>`; 
    } else {
        log.innerHTML = `<p>${currentEnemy.name} が あらわれた！</p>`; 
    }
    log.scrollTop = log.scrollHeight; 
    setTimeout(() => { document.getElementById('battle-commands').classList.remove('hidden'); uiSelections.battle = 0; updateScreen(); }, 800); 
  };

  // ★追加: 連戦フラグが立っている場合はトランジション（画面フェードアウト/イン）を省略して即開始
  if (isConsecutive) {
      initBattle();
  } else {
      playBattleTransition(() => {
          initBattle();
      });
  }
}

function updateBattleStatus() { 
  let pName = player.name;
  if (player.status) {
    if (player.status.poison) pName += " <span style='color:#f0f; font-size:12px;'>[毒]</span>";
    if (player.status.sleep > 0) pName += " <span style='color:#0af; font-size:12px;'>[眠]</span>";
    if (player.status.confuse > 0) pName += " <span style='color:#fa0; font-size:12px;'>[乱]</span>";
    if (player.status.seal > 0) pName += " <span style='color:#a0a; font-size:12px;'>[封]</span>";
  }
  document.getElementById('b-name').innerHTML = pName; 
  document.getElementById('b-lv').innerText = player.level;
  document.getElementById('b-hp').innerText = player.hp; 
  document.getElementById('b-mp').innerText = player.mp; 
}
function blinkEnemy() { const el = document.getElementById('enemy-img'); el.classList.remove('anim-blink'); void el.offsetWidth; el.classList.add('anim-blink'); }

function hideBattleCommands() { document.getElementById('battle-commands').classList.add('hidden'); document.getElementById('battle-sub-window').classList.add('hidden'); battleMenuState = 'main'; }

function applyPreActionStatus(battler, isPlayer) {
  const name = isPlayer ? player.name : battler.name;
  let canAct = true;
  let actionText = "";

  if (battler.status.seal > 0) battler.status.seal--;

  if (battler.status.sleep > 0) {
    battler.status.sleep--;
    actionText = `${name} は 眠っている！`;
    canAct = false;
    if (battler.status.sleep === 0) actionText += `<br>${name} は 目を覚ました！`;
  } else if (battler.status.confuse > 0) {
    battler.status.confuse--;
    if (Math.random() < 0.5) {
       actionText = `${name} は 混乱している！<br>${name} は 自分を攻撃した！`;
       let dmg = Math.max(1, Math.floor((isPlayer ? getPlayerAtk() : battler.attack) / 2));
       battler.hp = Math.max(0, battler.hp - dmg);
       actionText += `<br>${name} に ${dmg} のダメージ！`;
       if (!isPlayer) {
           setTimeout(blinkEnemy, 500);
       } else {
           playSE('damage');
           const display = document.getElementById('game-display');
           display.classList.remove('anim-damage'); void display.offsetWidth; display.classList.add('anim-damage');
       }
       canAct = false;
    }
    if (battler.status.confuse === 0) actionText += `<br>${name} は われにかえった！`;
  }
  return { canAct, actionText };
}

function applyPostTurnStatus() {
    let logTxt = "";
    if (player.status.poison && player.hp > 0) {
        let dmg = Math.max(1, Math.floor(player.maxHp * 0.1));
        player.hp = Math.max(0, player.hp - dmg);
        logTxt += `<p>${player.name} は 毒で ${dmg} のダメージを受けた！</p>`;
        const display = document.getElementById('game-display');
        display.classList.remove('anim-damage'); void display.offsetWidth; display.classList.add('anim-damage');
    }
    if (currentEnemy && currentEnemy.hp > 0 && currentEnemy.status && currentEnemy.status.poison) {
        let dmg = Math.max(1, Math.floor(currentEnemy.maxHp * 0.1));
        currentEnemy.hp = Math.max(0, currentEnemy.hp - dmg);
        logTxt += `<p>${currentEnemy.name} は 毒で ${dmg} のダメージを受けた！</p>`;
        blinkEnemy();
    }
    return logTxt;
}

function executeTurn(playerActionFn, priority = false) {
  hideBattleCommands();
  const log = document.getElementById('battle-log');
  
  const pAgi = player.agi * (0.8 + Math.random() * 0.4);
  const eAgi = currentEnemy.agi * (0.8 + Math.random() * 0.4);
  const playerFirst = priority || pAgi >= eAgi;

  const enemyActionFn = () => {
    if (currentEnemy.hp <= 0) return false; 
    
    let preCheck = applyPreActionStatus(currentEnemy, false);
    if (!preCheck.canAct) {
       log.innerHTML += `<p>${preCheck.actionText}</p>`;
       log.scrollTop = log.scrollHeight;
       updateBattleStatus();
       return true;
    }

    if (currentEnemy.fleeRate > 0 && Math.random() < currentEnemy.fleeRate) {
        log.innerHTML += `<p>${currentEnemy.name} は にげだした！</p><p>▼ 決定ボタンで進む</p>`;
        log.scrollTop = log.scrollHeight;
        battleMenuState = 'end';
        return false;
    }

    let actionText = "";
    let useAction = "こうげき"; 
    if (currentEnemy.actions && currentEnemy.actions.length > 0) {
       useAction = currentEnemy.actions[Math.floor(Math.random() * currentEnemy.actions.length)]; 
    }

    if (useAction === "逃げる") {
        log.innerHTML += `<p>${currentEnemy.name} は にげだした！</p><p>▼ 決定ボタンで進む</p>`;
        log.scrollTop = log.scrollHeight;
        battleMenuState = 'end';
        return false;
    } else if (useAction === "ラリホー") {
       if (currentEnemy.status.seal > 0) {
           actionText = `${currentEnemy.name} は ラリホーを となえた！<br>しかし 呪文は かき消された！`;
       } else { 
         if (Math.random() < 0.5) { 
             player.status.sleep = 2 + Math.floor(Math.random()*3); 
             actionText = `${currentEnemy.name} は ラリホーを となえた！<br>${player.name} は 眠ってしまった！`; 
         } else { 
             actionText = `${currentEnemy.name} は ラリホーを となえた！<br>しかし ${player.name} には 効かなかった！`; 
         }
       }
    } else if (useAction === "マホトーン") {
       if (currentEnemy.status.seal > 0) {
           actionText = `${currentEnemy.name} は マホトーンを となえた！<br>しかし 呪文は かき消された！`;
       } else { 
         if (Math.random() < 0.5) { 
             player.status.seal = 3 + Math.floor(Math.random()*3); 
             actionText = `${currentEnemy.name} は マホトーンを となえた！<br>${player.name} の 呪文が 封じられた！`; 
         } else { 
             actionText = `${currentEnemy.name} は マホトーンを となえた！<br>しかし ${player.name} には 効かなかった！`; 
         }
       }
    } else if (useAction === "メダパニ") {
       if (currentEnemy.status.seal > 0) {
           actionText = `${currentEnemy.name} は メダパニを となえた！<br>しかし 呪文は かき消された！`;
       } else { 
         if (Math.random() < 0.5) { 
             player.status.confuse = 2 + Math.floor(Math.random()*3); 
             actionText = `${currentEnemy.name} は メダパニを となえた！<br>${player.name} は 混乱してしまった！`; 
         } else { 
             actionText = `${currentEnemy.name} は メダパニを となえた！<br>しかし ${player.name} には 効かなかった！`; 
         }
       }
    } else if (useAction === "毒攻撃" || useAction === "こうげき") {
    // 追加: 敵の攻撃時の命中判定（プレイヤーの回避）
    const hitRate = 0.9 - (player.agi / 1000);
    const isHit = Math.random() < hitRate;

    if (!isHit) {
        playSE('miss'); // 追加: 攻撃が外れた時の音
        actionText = `${currentEnemy.name} の ${useAction === "毒攻撃" ? "どくこうげき" : "こうげき"}！<br>しかし ${player.name} は ひらりと みかわした！`;
    } else {
        let damage = Math.max(1, currentEnemy.attack - (getPlayerDef() / 2));
        if (isPlayerDefending) damage = Math.floor(damage / 2);
        player.hp = Math.max(0, player.hp - Math.floor(damage));
        
        if (useAction === "毒攻撃" && Math.random() < 0.3) {
            player.status.poison = true;
            actionText = `${currentEnemy.name} の どくこうげき！<br>${player.name} は ${Math.floor(damage)} のダメージを受け 毒におかされた！`;
        } else {
            actionText = `${currentEnemy.name} の こうげき！<br>${player.name} は ${Math.floor(damage)} のダメージを受けた！`;
        }
    }
} else { 
    // 魔法など他の行動のフォールバック用（重複していたelseを1つに統合）
    let damage = Math.max(1, currentEnemy.attack - (getPlayerDef() / 2));
    if (isPlayerDefending) damage = Math.floor(damage / 2);
    player.hp = Math.max(0, player.hp - Math.floor(damage));
    actionText = `${currentEnemy.name} の こうげき！<br>${player.name} は ${Math.floor(damage)} のダメージを受けた！`;
}

    log.innerHTML += `<p>${actionText}</p>`;
    log.scrollTop = log.scrollHeight;
    if (actionText.includes("ダメージ")) {
      playSE('damage');
      const display = document.getElementById('game-display');
      display.classList.remove('anim-damage'); void display.offsetWidth; display.classList.add('anim-damage');
    }
    updateBattleStatus();
    return true;
  };

  const pActionFn = () => {
    if (player.hp <= 0) return false;
    let preCheck = applyPreActionStatus(player, true);
    if (!preCheck.canAct) {
       log.innerHTML += `<p>${preCheck.actionText}</p>`;
       log.scrollTop = log.scrollHeight;
       updateBattleStatus();
       return true;
    }
    return playerActionFn(); 
  };

  const endTurn = () => {
    let pTxt = applyPostTurnStatus();
    if (pTxt) {
      log.innerHTML += pTxt;
      log.scrollTop = log.scrollHeight;
      updateBattleStatus();
    }
    setTimeout(() => {
      if (player.hp <= 0) handleDeath();
      else if (currentEnemy.hp <= 0) endBattle(true);
      else { isPlayerDefending = false; document.getElementById('battle-commands').classList.remove('hidden'); updateScreen(); }
    }, pTxt ? 1500 : 0);
  };

  if (playerFirst) {
    if (pActionFn() === false) return; 
    setTimeout(() => {
      if (player.hp <= 0 || currentEnemy.hp <= 0) { endTurn(); return; }
      if (enemyActionFn() === false) return; 
      setTimeout(() => {
        endTurn();
      }, 1500);
    }, 1500);
  } else {
    if (enemyActionFn() === false) return; 
    setTimeout(() => {
      if (player.hp <= 0 || currentEnemy.hp <= 0) { endTurn(); return; }
      if (pActionFn() === false) return; 
      setTimeout(() => {
        endTurn();
      }, 1500);
    }, 1500);
  }
}

function processBattleCommand(cmdIndex) { 
  const log = document.getElementById('battle-log'); 
  
  if (cmdIndex === 0) { 
    executeTurn(() => {
      let actionText = "";

      // 追加: 命中判定 (基本90%命中とし、敵の素早さで微調整)
      const hitRate = 0.9 - (currentEnemy.agi / 1000);
      const isHit = Math.random() < hitRate;

      if (!isHit) {
        playSE('miss'); // 追加: 攻撃が外れた時の音
        actionText = `${player.name} の こうげき！<br>しかし 攻撃は はずれた！`;
        log.innerHTML += `<p>${actionText}</p>`; log.scrollTop = log.scrollHeight; updateBattleStatus();
        return true;
      }

      playSE('attack');
      const criticalRate = (1 / 64) + (player.luck / 1024);
      const isCritical = Math.random() < criticalRate;
      let damage = 0;
      if (isCritical) {
        damage = getPlayerAtk(); 
        actionText = `${player.name} の こうげき！<br><span style="color:#ff5555; font-weight:bold;">かいしんのいちげき！</span><br>${currentEnemy.name} に ${Math.floor(damage)} のダメージ！`;
        const el = document.getElementById('enemy-img'); 
        el.classList.remove('anim-critical'); void el.offsetWidth; el.classList.add('anim-critical');
      } else {
        damage = Math.max(1, getPlayerAtk() - (currentEnemy.def/2)); 
        actionText = `${player.name} の こうげき！<br>${currentEnemy.name} に ${Math.floor(damage)} のダメージ！`;
        blinkEnemy(); 
      }
      currentEnemy.hp = Math.max(0, currentEnemy.hp - damage); 
      log.innerHTML += `<p>${actionText}</p>`; log.scrollTop = log.scrollHeight; updateBattleStatus();
      return true;
    });
  } else if (cmdIndex === 3) { 
    executeTurn(() => {
      isPlayerDefending = true; 
      log.innerHTML += `<p>${player.name} は 身を 守っている！</p>`; log.scrollTop = log.scrollHeight; updateBattleStatus();
      return true;
    }, true); 
  } else if (cmdIndex === 4) { 
    executeTurn(() => {
      if (Math.random() > 0.3) { 
        log.innerHTML += `<p>${player.name} は にげだした！</p><p>▼ 決定ボタンで進む</p>`; 
        log.scrollTop = log.scrollHeight;
        battleMenuState = 'end';
        return false; 
      } else { 
        log.innerHTML += `<p>${player.name} は にげだした！<br>しかし まわりこまれてしまった！</p>`; 
        log.scrollTop = log.scrollHeight; updateBattleStatus();
        return true;
      } 
    }, true); 
  } 
}

function processMagic(index) { 
  const spellName = player.spells[index]; 
  const spell = SPELL_DB[spellName];
  const log = document.getElementById('battle-log'); 
  executeTurn(() => {
    playSE('magic');
    let actionText = ""; 
    if (player.status.seal > 0) {
       actionText = `${player.name} は ${spellName}を となえた！<br>しかし 呪文は かき消された！`;
    } else if (spellName === "ルーラ") {
       actionText = `ここでは つかえない か なにも おきなかった！`;
    } else if (spell) {
       if (player.mp >= spell.mp) {
           player.mp = Math.max(0, player.mp - spell.mp);
           actionText = `${player.name} は ${spellName}を となえた！<br>`;
           if (spell.type === "attack") {
               let dmg = spell.val + Math.floor(Math.random()*10); 
               currentEnemy.hp = Math.max(0, currentEnemy.hp - dmg);
               actionText += `${currentEnemy.name} に ${dmg} ${spell.text}`;
               blinkEnemy();
           } else if (spell.type === "heal") {
               player.hp = Math.min(player.maxHp, player.hp + spell.val);
               actionText += `${player.name} の ${spell.text}`;
           } else if (spell.type === "cure") {
               if (player.status[spell.status]) {
                   player.status[spell.status] = false;
                   actionText += `${player.name} の ${spell.text}`;
               } else {
                   actionText += `しかし なにも おきなかった！`;
               }
           } else if (spell.type === "status") {
               let resist = 0.5; // ★ここから追加
               if (spell.status === "sleep") resist = currentEnemy.sleepResist;
               if (spell.status === "seal") resist = currentEnemy.sealResist;
               if (spell.status === "confuse") resist = currentEnemy.confuseResist;
               
               if (Math.random() < resist) { // ★ここまで追加
                   currentEnemy.status[spell.status] = spell.val; 
                   if(spell.status === 'poison') currentEnemy.status.poison = true;
                   actionText += `${currentEnemy.name} ${spell.text}`;
               } else {
                   actionText += `しかし ${currentEnemy.name} には 効かなかった！`;
               }
           }
       } else {
           actionText = `ＭＰが 足りない！`;
       }
    } else {
       actionText = `ここでは つかえない か なにも おきなかった！`;
    }
    log.innerHTML += `<p>${actionText}</p>`; log.scrollTop = log.scrollHeight; updateBattleStatus(); 
    return true;
  });
}

function processItem(index) { 
  const item = player.inventory[index]; 
  const log = document.getElementById('battle-log'); 
  executeTurn(() => {
    playSE('item');
    let actionText = ""; 
    if (item.type === "heal") { 
      const heal = item.val || 20; player.hp = Math.min(player.maxHp, player.hp + heal); 
      actionText = `${player.name} は ${item.name} を 使った！<br>ＨＰが ${heal} かいふくした！`; item.count--; 
      if (item.count <= 0) player.inventory.splice(index, 1); 
    } else if (item.type === "cure") {
      if (player.status.poison) {
         player.status.poison = false;
         actionText = `${player.name} は ${item.name} を 使った！<br>毒が ぬけた！`;
      } else {
         actionText = `${player.name} は ${item.name} を 使おうとしたが なにも おきなかった。`;
      }
      item.count--; 
      if (item.count <= 0) player.inventory.splice(index, 1); 
    } else if (item.type === "seed") {
      actionText = `${player.name} は ${item.name} を 使おうとしたが<br>いまは それどころではない！`;
    } else if (item.type === "key") {
      actionText = `${player.name} は ${item.name} を 使おうとしたが<br>ここでは なにも おきなかった。<br>（扉に向かって 決定ボタンで 使おう）`;
    } else actionText = `${player.name} は ${item.name} を 使おうとしたが なにも おきなかった。`; 
    log.innerHTML += `<p>${actionText}</p>`; log.scrollTop = log.scrollHeight; updateBattleStatus(); 
    return true;
  });
}

function endBattle(isWin) { 
  const log = document.getElementById('battle-log'); 
  if (isWin) { 
    // ▼ 音声再生の追加：第二形態がなければ（完全に勝利したら）勝利BGMを鳴らす
    if (!currentEnemy.nextEnemyData) {
      stopBGM();
      playBGM('victory', false); // 勝利BGMを再生
    }

    document.getElementById('enemy-img').style.visibility = 'hidden';
    log.innerHTML += `<p>${currentEnemy.name} を たおした！<br>${currentEnemy.exp} の経験値 と ${currentEnemy.gold} ゴールドを獲得！</p>`; 
    player.exp += currentEnemy.exp; player.gold += currentEnemy.gold; 
    
    const adjustedDropRate = currentEnemy.dropRate * (1 + player.luck / 200);
    if (currentEnemy.dropItem && Math.random() < adjustedDropRate) {
      log.innerHTML += `<p style="color:yellow">${currentEnemy.dropItem} を おとした！</p>`;
      const itemData = ITEM_DB[currentEnemy.dropItem] || { name: currentEnemy.dropItem, type: "heal", val: 20, price: 10 };
      pushToInventory(itemData);
    }

    let hasLeveledUp = false;
    while (player.level < 99 && NEXT_EXP[player.level] && player.exp >= NEXT_EXP[player.level]) { 
      player.level++; 
      hasLeveledUp = true;
      let upHp = 3 + Math.floor(Math.random()*4); let upMp = 2 + Math.floor(Math.random()*3);
      let upStr = 2 + Math.floor(Math.random()*2); let upDef = 2 + Math.floor(Math.random()*2);
      let upAgi = 2 + Math.floor(Math.random()*2); let upInt = 2 + Math.floor(Math.random()*2);
      let upLuck = 2 + Math.floor(Math.random()*2);

      if (player.maxHp + upHp > 999) upHp = 999 - player.maxHp;
      if (player.maxMp + upMp > 999) upMp = 999 - player.maxMp;
      if (player.str + upStr > 999) upStr = 999 - player.str;
      if (player.def + upDef > 999) upDef = 999 - player.def;
      if (player.agi + upAgi > 999) upAgi = 999 - player.agi;
      if (player.int + upInt > 999) upInt = 999 - player.int;
      if (player.luck + upLuck > 999) upLuck = 999 - player.luck;

      player.maxHp += upHp; player.hp = player.maxHp; 
      player.maxMp += upMp; player.mp = player.maxMp; 
      player.str += upStr; player.def += upDef; player.agi += upAgi; player.int += upInt; player.luck += upLuck;
      
      let levelUpMsg = `<p style="color:yellow; line-height:1.2; margin:5px 0;">レベル${player.level} に あがった！<br>`;
      levelUpMsg += `最大ＨＰ +${upHp} / 最大ＭＰ +${upMp}<br>`;
      levelUpMsg += `ちから +${upStr} / みのまもり +${upDef}<br>`;
      levelUpMsg += `かしこさ +${upInt} / すばやさ +${upAgi}<br>`;
      levelUpMsg += `うんのよさ +${upLuck}</p>`;
      log.innerHTML += levelUpMsg; 

      if (SPELL_LEARN_TABLE[player.level]) {
        SPELL_LEARN_TABLE[player.level].forEach(spell => {
           if (!player.spells.includes(spell)) {
               player.spells.push(spell);
               log.innerHTML += `<p style="color:yellow">${spell}を おぼえた！</p>`;
           }
        });
      }
    }

    if (hasLeveledUp) {
      playSE('levelup');
    }

    log.innerHTML += `<p>▼ 決定ボタンで進む</p>`;
    log.scrollTop = log.scrollHeight; 
    
    // ★追加: 第二形態のデータが存在すれば次の戦闘待機状態へ、なければ戦闘を終了する
    if (currentEnemy.nextEnemyData) {
        battleMenuState = 'next_battle';
    } else {
        battleMenuState = 'end';
    }
  } 
}

function updateMenuUI() {
  const details = document.getElementById('menu-details'); details.classList.remove('hidden');
  const menus = document.getElementById('menu-main').children;
  for (let i = 0; i < menus.length; i++) menus[i].classList.toggle('selected', menuState === 'main' && i === uiSelections.menuMain);
  if (menuState === 'main') {
    let nextExpTxt = (player.level < 99 && NEXT_EXP[player.level]) ? (NEXT_EXP[player.level] - player.exp) : "なし";
