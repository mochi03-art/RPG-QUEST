    if (uiSelections.menuMain === 0) details.innerHTML = `<div style="display:flex; font-size:12px; line-height:1.6; letter-spacing:-0.5px; width:100%;"><div style="flex:1; padding-right:5px;">なまえ：${player.name}${statusText}<br>レベル：${player.level}<br>ＨＰ：${player.hp}/${player.maxHp}<br>ＭＰ：${player.mp}/${player.maxMp}<br>お金：${player.gold} G<br>次Lvまで：${nextExpTxt}</div><div style="flex:1;">ちから：${player.str}<br>みのまもり：${player.def}<br>かしこさ：${player.int}<br>すばやさ：${player.agi}<br>うんのよさ：${player.luck}<br>こうげき力：${getPlayerAtk()}<br>しゅび力：${getPlayerDef()}</div></div>`;
    else if (uiSelections.menuMain === 1) details.innerHTML = `<div>ぶき：${player.equipment.weapon?player.equipment.weapon.name:"なし"}</div><div>たて：${player.equipment.shield?player.equipment.shield.name:"なし"}</div><div>かぶと：${player.equipment.helmet?player.equipment.helmet.name:"なし"}</div><div>よろい：${player.equipment.armor?player.equipment.armor.name:"なし"}</div>`;
    else if (uiSelections.menuMain === 2) details.innerHTML = player.inventory.length > 0 ? `<div>${player.inventory.map(i => i.name + " x" + i.count).join('<br>')}</div>` : `<div>どうぐを もっていない</div>`;
    else if (uiSelections.menuMain === 3) details.innerHTML = player.spells.length > 0 ? `<div>${player.spells.join('<br>')}</div>` : `<div>じゅもんを おぼえていない</div>`;
    else if (uiSelections.menuMain === 4) details.innerHTML = `<div>〇ボタンで セーブする</div>`;
    else if (uiSelections.menuMain === 5) details.innerHTML = `<div>〇ボタンで<br>タイトルへもどる</div>`;
  } else if (menuState === 'equip_tab') { let html = '<div style="margin-bottom:10px;">【そうび 変更】</div>'; EQUIP_NAMES.forEach((n, i) => { const e = player.equipment[EQUIP_TYPES[i]]; html += `<div class="menu-item${(i === menuIndices.equipTab)?' selected':''}">${n}：${e?e.name:"なし"}</div>`; }); details.innerHTML = html;
  } else if (menuState === 'equip_list') { let html = '<div style="margin-bottom:10px;">【どれを そうびする？】</div><div class="menu-item'+(menuIndices.equipList===0?' selected':'')+'">はずす</div>'; filteredItems.forEach((item, i) => { html += `<div class="menu-item${(i + 1 === menuIndices.equipList)?' selected':''}">${item.name}</div>`; }); details.innerHTML = html;
  } else if (menuState === 'item_list') { let html = '<div style="margin-bottom:10px;">【どうぐ】</div>'; player.inventory.forEach((item, i) => { html += `<div class="menu-item${(i === menuIndices.itemList)?' selected':''}">${item.name} x${item.count}</div>`; }); details.innerHTML = html;
  } else if (menuState === 'item_action') { let html = `<div style="margin-bottom:10px;">${player.inventory[selectedItemIndex].name}</div>`; ['つかう', 'すてる'].forEach((act, i) => { html += `<div class="menu-item${(i === menuIndices.itemAction)?' selected':''}">${act}</div>`; }); details.innerHTML = html;
  } else if (menuState === 'item_use_count') {
    let item = player.inventory[selectedItemIndex];
    let html = `<div style="margin-bottom:10px;">${item.name} を 何個つかう？</div>`;
    html += `<div style="display:flex; justify-content:center; align-items:center; margin:20px 0; font-size:18px;">`;
    html += `<span>◀</span><span style="margin: 0 30px;">${useItemCount}</span><span>▶</span>`;
    html += `</div><div style="text-align:center; font-size:12px; margin-top:10px;">決定ボタンで つかう</div>`;
    details.innerHTML = html;
  } else if (menuState === 'magic_list') { let html = '<div style="margin-bottom:10px;">【じゅもん】</div>'; player.spells.forEach((spell, i) => { html += `<div class="menu-item${(i === menuIndices.magicList)?' selected':''}">${spell}</div>`; }); details.innerHTML = html; 
  } else if (menuState === 'rula_list') { let html = '<div style="margin-bottom:10px;">【どこへ いく？】</div>'; rulaTargets.forEach((t, i) => { html += `<div class="menu-item${(i === menuIndices.rulaList)?' selected':''}">${t.name}</div>`; }); details.innerHTML = html; }
}

function hasSaveData() { return localStorage.getItem('rpg_save_data') !== null; }
function saveGame() { localStorage.setItem('rpg_save_data', JSON.stringify({ player, currentMapId })); }
function loadGame() { 
  const data = localStorage.getItem('rpg_save_data'); 
  if (data) { 
    const parsed = JSON.parse(data); 
    player = parsed.player; 
    if (player.luck === undefined) player.luck = 5;
    if (!player.status) player.status = { poison: false, sleep: 0, confuse: 0, seal: 0 };
    currentMapId = parsed.currentMapId; 
    generateMap(); 
    return true; 
  } 
  return false; 
}

function handleChoiceAction(choice, npc) {
  if (choice.action === 'battle') {
    // 選択肢NPCにも戦闘NPCと同様にステータスや画像・第二形態のデータを紐づけるため、npcとchoiceのデータを結合します。
    let battleData = { ...npc, ...choice };
    // choice側にvalue(敵の名前など)がある場合は、敵の名前として優先適用します。
    if (choice.value && !choice.custom && typeof choice.value === 'string') {
      battleData.enemy = choice.value;
    }
    startEventBattle(battleData);
  } else showMessage(choice.value);
}

// 目の前の扉を開ける処理を行う関数
function checkDoorAction(tx, ty) {
  const mapObj = mapsData[currentMapId];
  if (tx < 0 || tx >= mapObj.width || ty < 0 || ty >= mapObj.height) return false;
  
  // マップ上のタイルIDを取得
  const tile = mapObj.data[ty][tx];
  
  // タイルIDから必要な鍵を判定
  let keyNeeded = null;
  if (tile === 18) keyNeeded = "とうぞくのかぎ";      // 茶色の扉
  else if (tile === 19) keyNeeded = "まほうのかぎ";    // 青色の扉
  else if (tile === 20) keyNeeded = "さいごのかぎ";    // 赤色の扉

  if (keyNeeded) {
    // インベントリ内に該当の鍵があるかチェック
    const hasKey = player.inventory.some(item => item.name === keyNeeded);
    
    if (hasKey) {
      playSE('ok'); // または扉が開く専用のSE（'door'等）があれば変更
      
      // マップエディタで設定した透過背景タイル(bgData)を取得。なければ平地(0)
      let baseTileId = 0; 
const doorNpc = mapObj.npcs[`${tx},${ty}`];
if (doorNpc && doorNpc.bgTile !== undefined && doorNpc.bgTile !== -1) {
    baseTileId = doorNpc.bgTile;
} else if (doorNpc && doorNpc.bgTileId !== undefined && doorNpc.bgTileId !== -1) {
    baseTileId = doorNpc.bgTileId;
} 
else if (mapObj.bgData && mapObj.bgData[ty] && mapObj.bgData[ty][tx] !== undefined && mapObj.bgData[ty][tx] !== -1) {
  baseTileId = mapObj.bgData[ty][tx];
}
      
      // 扉タイルを元の床タイルに書き換えて通行可能にする
      mapObj.data[ty][tx] = baseTileId;
      drawField(); // 画面を再描画して開いた状態を反映
      showMessage(`${player.name} は ${keyNeeded} を 使った！\n扉が 開いた！`);
    } else {
      playSE('cancel');
      showMessage(`かたく 閉ざされている。\n開けるには ${keyNeeded} が 必要だ。`);
    }
    return true; // 対象が扉だったためtrueを返し、後続のNPC判定をスキップさせる
  }
  return false; // 対象が扉ではなかった場合はfalseを返す
}

function handleOk() {
  playSE('ok');
  if (isFading) return; 
  if (currentState === GAME_STATE.TITLE) {
    if (uiSelections.title === 0) { resetPlayer(); switchState(GAME_STATE.NAME_INPUT); }
    else { if (loadGame()) switchState(GAME_STATE.FIELD); else alert("セーブデータが ありません"); }
  } else if (currentState === GAME_STATE.NAME_INPUT) {
    const name = document.getElementById('player-name-input').value.trim();
    if (name.length > 0) { player.name = name; switchState(GAME_STATE.FIELD); }
  } else if (currentState === GAME_STATE.FIELD) {
    let cx = player.x, cy = player.y;
    if (player.dir === 'up') cy--; if (player.dir === 'down') cy++;
    if (player.dir === 'left') cx--; if (player.dir === 'right') cx++;
    if (checkDoorAction(cx, cy)) {
      return; // 目の前が扉であり、判定処理を行った場合はここで処理を終了する
    }

    const map = mapsData[currentMapId];
    if (map.npcs[`${cx},${cy}`]) {
      const npc = map.npcs[`${cx},${cy}`];
      const type = npc.type || 'talk';
      const text = npc.text || "......";
      const objKey = `${currentMapId}_${cx}_${cy}`;
      const npcDef = NPC_DB[type] || NPC_DB['talk'];
      
      if (npcDef.isObject) {
        if (player.opened && player.opened.includes(objKey)) { showMessage("しかし なにも なかった。"); } 
        else {
          if (!player.opened) player.opened = [];
          player.opened.push(objKey);

          // 初期値をマップデータ（オブジェクト自身）ではなく、0（平地）にする
          let baseTileId = 0; 
if (npc.openedTile !== undefined && npc.openedTile !== -1) {
  baseTileId = npc.openedTile;
} else if (npc.openedTileId !== undefined && npc.openedTileId !== -1) {
  baseTileId = npc.openedTileId;
}
else if (npc.bgTile !== undefined && npc.bgTile !== -1) {
  baseTileId = npc.bgTile;
} else if (npc.bgTileId !== undefined && npc.bgTileId !== -1) {
  baseTileId = npc.bgTileId;
} else if (npc.baseTile !== undefined && npc.baseTile !== -1) {
  baseTileId = npc.baseTile;
}
else if (map.bgData && map.bgData[cy] && map.bgData[cy][cx] !== undefined && map.bgData[cy][cx] !== -1) {
  baseTileId = map.bgData[cy][cx];
}
          map.data[cy][cx] = baseTileId;

          const itemName = npc.item || "やくそう";
          if (itemName.endsWith("G") || itemName.endsWith("Ｇ")) { const gold = parseInt(itemName); player.gold += gold; showMessage(`${gold}ゴールドを 手に入れた！`); } 
          else { const itemData = ITEM_DB[itemName] || { name: itemName, type: "heal", val: 20, price: 10 }; pushToInventory(itemData); showMessage(`${itemName}を 手に入れた！`); }
          drawField();
        }
      }
      else if (type === 'talk' || type === 'king') { showMessage(text); }
      else if (type === 'battle') { showMessage(text, () => startEventBattle(npc)); }
      else if (type === 'choice') { showMessage(text, () => { showConfirm(() => handleChoiceAction(npc.choices[0], npc), () => handleChoiceAction(npc.choices[1], npc), npc.choices[0].label, npc.choices[1].label); }); }
      else if (type === 'inn') {
        showMessage([text, `１泊 ${npc.price} G ですが 泊まりますか？`], () => {
          showConfirm(() => {
            if (player.gold >= npc.price) { 
                // 【既存の処理】 お金の消費、HP・MPの回復、状態異常の解除（この部分は変更していません）
                player.gold -= npc.price; player.hp = player.maxHp; player.mp = player.maxMp; 
                if (player.status) player.status = { poison: false, sleep: 0, confuse: 0, seal: 0 };
                
                // === 追加・変更した処理ここから ===
                isFading = true; // 暗転中の移動やキー操作をブロックする
                stopBGM(); // 宿屋の音がしっかり聞こえるように、現在のフィールドBGMを止める
                document.getElementById('fade-overlay').classList.add('active'); // 画面を暗転させる
                playSE('inn'); // 宿屋の音を再生する
                
                // 6秒(6000ミリ秒)後に暗転を解除するタイマー
                setTimeout(() => {
                  document.getElementById('fade-overlay').classList.remove('active'); // 暗転解除
                  
                  // CSSの暗転解除アニメーション(0.5秒)が終わるのを待ってから処理を再開
                  setTimeout(() => {
                    isFading = false; // 操作ブロックを解除する
                    playBGM('town'); // フィールドのBGMを再開する
                    
                    // 回復完了のメッセージを表示
                    showMessage("おはようございます。---どうぞきをつけて いってらっしゃいませ！"); 
                  }, 500); 
                }, 6000); 
                // === 追加・変更した処理ここまで ===

            } else { showMessage("お金が 足りないようです..."); }
          });
        });
      } else if (type.includes('_shop')) { openShop(npc); }
    }
  } else if (currentState === GAME_STATE.MESSAGE) {
    displayNextMessage();
  } else if (currentState === GAME_STATE.CONFIRM) {
    document.getElementById('confirm-window').classList.remove('active');
    if (confirmCursor === 0 && confirmCallbackYes) confirmCallbackYes();
    else if (confirmCursor === 1 && confirmCallbackNo) confirmCallbackNo();
    else switchState(GAME_STATE.FIELD);
  } else if (currentState === GAME_STATE.SHOP) {
    if (shopState === 'select') {
      if (shopCursor === 0) { shopState = 'buy'; shopCursor = 0; document.getElementById('shop-msg').innerText = "どれを かうかね？"; updateShopUI(); }
      else if (shopCursor === 1) { shopState = 'sell'; shopCursor = 0; document.getElementById('shop-msg').innerText = "どれを うるかね？"; updateShopUI(); }
      else { closeShop(); }
    } else if (shopState === 'buy') {
      if (shopCursor === currentShopItems.length || currentShopItems.length === 0) { shopState = 'select'; shopCursor = 0; document.getElementById('shop-msg').innerText = "ほかに 用はあるかね？"; updateShopUI(); }
      else {
        const item = currentShopItems[shopCursor];
        // 1. 確認メッセージを表示
        document.getElementById('shop-msg').innerText = `${item.name} を かうかね？`;
        // 2. 確認ウィンドウを呼び出し
        showConfirm(
          () => {
            // 「はい」が選ばれた場合
            currentState = GAME_STATE.SHOP; // 状態をショップに戻す
            if (player.gold >= item.price) { 
              player.gold -= item.price; pushToInventory(item); 
              document.getElementById('shop-msg').innerHTML = `${item.name} を手に入れた！`; 
            }
            else { document.getElementById('shop-msg').innerHTML = `お金が 足りないようだ。`; }
            updateShopUI();
          },
          () => {
            // 「いいえ」が選ばれた場合
            currentState = GAME_STATE.SHOP; // 状態をショップに戻す
            document.getElementById('shop-msg').innerText = "どれを かうかね？";
            updateShopUI();
          }
        );
      }
    } else if (shopState === 'sell') {
      let sellableItems = player.inventory.filter(i => (i.price && i.price > 0) || (i.sellPrice !== undefined && i.sellPrice > 0));
      if (shopCursor === sellableItems.length || sellableItems.length === 0) { shopState = 'select'; shopCursor = 1; document.getElementById('shop-msg').innerText = "ほかに 用はあるかね？"; updateShopUI(); }
      else {
        const item = sellableItems[shopCursor];
        let sellPrice = item.sellPrice !== undefined ? item.sellPrice : Math.floor((item.price || 0) / 2);
        // 1. 確認メッセージを表示
        document.getElementById('shop-msg').innerText = `${item.name} を ${sellPrice} G で うるかね？`;
        // 2. 確認ウィンドウを呼び出し
        showConfirm(
          () => {
            // 「はい」が選ばれた場合
            currentState = GAME_STATE.SHOP; // 状態をショップに戻す
            player.gold += sellPrice;
            item.count--;
            if (item.count <= 0) player.inventory.splice(player.inventory.indexOf(item), 1);
            document.getElementById('shop-msg').innerHTML = `${item.name} を ${sellPrice} G で買い取った！`;
            shopCursor = Math.min(shopCursor, player.inventory.filter(i => (i.price && i.price > 0) || (i.sellPrice !== undefined && i.sellPrice > 0)).length);
            updateShopUI();
          },
          () => {
            // 「いいえ」が選ばれた場合
            currentState = GAME_STATE.SHOP; // 状態をショップに戻す
            document.getElementById('shop-msg').innerText = "どれを うるかね？";
            updateShopUI();
          }
        );
      }
    }
  } else if (currentState === GAME_STATE.BATTLE) {
    if (battleMenuState === 'end') {
      switchState(GAME_STATE.FIELD);
    } else if (battleMenuState === 'next_battle') { 
      // ★追加: 決定ボタン押下で第二形態（連戦）へ移行
      let nextData = currentEnemy.nextEnemyData;
      currentEnemy = null;
      startEventBattle(nextData, true); // 第2引数 true を渡すことで画面遷移エフェクトをスキップ
    } else if (!document.getElementById('battle-commands').classList.contains('hidden')) {
      if (battleMenuState === 'main') { if (uiSelections.battle===0||uiSelections.battle===3||uiSelections.battle===4) processBattleCommand(uiSelections.battle); else if (uiSelections.battle===1 && player.spells.length>0) { battleMenuState='magic'; uiSelections.battleSub=0; updateScreen(); } else if (uiSelections.battle===2 && player.inventory.length>0) { battleMenuState='item'; uiSelections.battleSub=0; updateScreen(); } }
      else if (battleMenuState === 'magic' && player.spells.length>0) processMagic(uiSelections.battleSub);
      else if (battleMenuState === 'item' && player.inventory.length>0) processItem(uiSelections.battleSub);
    }
  } else if (currentState === GAME_STATE.MENU) {
    if (menuState === 'main') {
      if (uiSelections.menuMain === 1) { menuState = 'equip_tab'; menuIndices.equipTab = 0; updateMenuUI(); }
      else if (uiSelections.menuMain === 2 && player.inventory.length > 0) { menuState = 'item_list'; menuIndices.itemList = 0; updateMenuUI(); }
      else if (uiSelections.menuMain === 3 && player.spells.length > 0) { menuState = 'magic_list'; menuIndices.magicList = 0; updateMenuUI(); }
      else if (uiSelections.menuMain === 4) { saveGame(); document.getElementById('menu-details').innerHTML = `<div>きろく しました。</div>`; setTimeout(() => updateMenuUI(), 1000); }
      else if (uiSelections.menuMain === 5) { menuState = 'main'; switchState(GAME_STATE.TITLE); }
    } else if (menuState === 'equip_tab') { filteredItems = player.inventory.filter(i => i.type === EQUIP_TYPES[menuIndices.equipTab]); menuState = 'equip_list'; menuIndices.equipList = 0; updateMenuUI();
    } else if (menuState === 'equip_list') { const type = EQUIP_TYPES[menuIndices.equipTab]; if (menuIndices.equipList === 0) { const cur = player.equipment[type]; if (cur) { pushToInventory(cur); player.equipment[type] = null; } } else { const sel = filteredItems[menuIndices.equipList - 1]; sel.count--; if (sel.count <= 0) player.inventory.splice(player.inventory.indexOf(sel), 1); const cur = player.equipment[type]; if (cur) pushToInventory(cur); player.equipment[type] = { ...sel, count: 1 }; } menuState = 'equip_tab'; updateMenuUI();
    } else if (menuState === 'item_list') { selectedItemIndex = menuIndices.itemList; menuState = 'item_action'; menuIndices.itemAction = 0; updateMenuUI();
    } else if (menuState === 'item_action') { 
      const item = player.inventory[selectedItemIndex]; 
      if (menuIndices.itemAction === 0) { 
        if (item.type === 'heal' || item.type === 'seed') { 
          useItemCount = 1; menuState = 'item_use_count'; updateMenuUI(); 
        } else if (item.type === 'cure') {
          if (player.status.poison) {
              player.status.poison = false;
              item.count--;
              if (item.count <= 0) player.inventory.splice(selectedItemIndex, 1);
              document.getElementById('menu-details').innerHTML = `<div>${player.name} は ${item.name} をつかった！<br>毒が ぬけた！</div>`;
          } else {
              document.getElementById('menu-details').innerHTML = `<div>毒には おかされていない！</div>`;
          }
          setTimeout(() => { 
             menuState = player.inventory.length === 0 ? 'main' : 'item_list'; 
             menuIndices.itemList = Math.min(menuIndices.itemList, Math.max(0, player.inventory.length - 1));
             updateMenuUI(); 
          }, 1500);
        } else { 
          document.getElementById('menu-details').innerHTML = `<div>ここでは つかえない。</div>`; 
          setTimeout(() => updateMenuUI(), 1000); 
        } 
      } else if (menuIndices.itemAction === 1) { 
        player.inventory.splice(selectedItemIndex, 1); 
        menuState = player.inventory.length === 0 ? 'main' : 'item_list'; 
        menuIndices.itemList = Math.min(menuIndices.itemList, Math.max(0, player.inventory.length - 1));
        updateMenuUI(); 
      }
    } else if (menuState === 'item_use_count') {
      let item = player.inventory[selectedItemIndex];
      if (item.type === 'heal') {
        let healAmount = (item.val || 20) * useItemCount;
        let oldHp = player.hp;
        player.hp = Math.min(player.maxHp, player.hp + healAmount);
        let actualHeal = player.hp - oldHp;
        
        item.count -= useItemCount;
        if (item.count <= 0) player.inventory.splice(selectedItemIndex, 1);
        
        let msg = actualHeal > 0 ? `ＨＰが ${actualHeal} かいふくした！` : `しかし ＨＰは 満タンだった。`;
        document.getElementById('menu-details').innerHTML = `<div style="line-height:1.4;">${player.name} は<br>${item.name} を ${useItemCount}個 つかった！<br>${msg}</div>`;
      } else if (item.type === 'seed') {
        let statKey = item.stat;
        let maxLimit = 999;
        let statName = "";
        
        if (statKey === 'maxHp') statName = "最大ＨＰ";
        else if (statKey === 'maxMp') statName = "最大ＭＰ";
        else if (statKey === 'str') statName = "ちから";
        else if (statKey === 'def') statName = "みのまもり";
        else if (statKey === 'int') statName = "かしこさ";
        else if (statKey === 'agi') statName = "すばやさ";
        else if (statKey === 'luck') statName = "うんのよさ";

        if (player[statKey] >= maxLimit) {
          document.getElementById('menu-details').innerHTML = `<div style="line-height:1.4;">${statName} は すでに最大だ！<br>これ以上は あがらない。</div>`;
        } else {
          let totalVal = 0;
          let actualUsedCount = 0;
          for(let i=0; i<useItemCount; i++){
            let up = (statKey === 'maxHp' || statKey === 'maxMp') ? (3 + Math.floor(Math.random()*3)) : (1 + Math.floor(Math.random()*3));
            if (player[statKey] + totalVal + up > maxLimit) {
              up = maxLimit - (player[statKey] + totalVal);
            }
            totalVal += up;
            actualUsedCount++;
            if (player[statKey] + totalVal >= maxLimit) break; 
          }
          
          player[statKey] += totalVal;
          if (statKey === 'maxHp') player.hp += totalVal;
          if (statKey === 'maxMp') player.mp += totalVal;
          
          item.count -= actualUsedCount;
          if (item.count <= 0) player.inventory.splice(selectedItemIndex, 1);
          
          document.getElementById('menu-details').innerHTML = `<div style="line-height:1.4;">${player.name} は<br>${item.name} を ${actualUsedCount}個 つかった！<br>${statName} が ${totalVal} あがった！</div>`;
        }
      }
      setTimeout(() => { 
         menuState = player.inventory.length === 0 ? 'main' : 'item_list'; 
         menuIndices.itemList = Math.min(menuIndices.itemList, Math.max(0, player.inventory.length - 1));
         updateMenuUI(); 
      }, 1500);
    } else if (menuState === 'magic_list') { 
      const spell = player.spells[menuIndices.magicList]; const d = document.getElementById('menu-details'); 
      if (player.status && player.status.seal > 0) {
          d.innerHTML = `<div>呪文が 封じられている！</div>`; setTimeout(() => updateMenuUI(), 1000); 
      } else if (spell === "ホイミ" || spell === "ベホイミ" || spell === "ベホマ") {
          let spellData = SPELL_DB[spell];
          if (player.mp >= spellData.mp && player.hp < player.maxHp) { 
              player.mp -= spellData.mp; player.hp = Math.min(player.maxHp, player.hp + spellData.val); 
              d.innerHTML = `<div>${player.name} は ${spell}を となえた！<br>ＨＰが かいふくした！</div>`; setTimeout(() => updateMenuUI(), 1000); 
          } else {
              d.innerHTML = player.mp < spellData.mp ? `<div>ＭＰが 足りない！</div>` : `<div>ＨＰは 満タンだ！</div>`;
              setTimeout(() => updateMenuUI(), 1000);
          }
      } else if (spell === "キアリー") {
          let spellData = SPELL_DB[spell];
          if (player.mp >= spellData.mp && player.status.poison) {
              player.mp -= spellData.mp; player.status.poison = false;
              d.innerHTML = `<div>${player.name} は キアリーを となえた！<br>毒が ぬけた！</div>`; setTimeout(() => updateMenuUI(), 1000);
          } else {
              d.innerHTML = player.mp < spellData.mp ? `<div>ＭＰが 足りない！</div>` : `<div>毒には おかされていない！</div>`;
              setTimeout(() => updateMenuUI(), 1000);
          }
      } else if (spell === "ルーラ") {
        if (player.mp >= SPELL_DB["ルーラ"].mp) {
          rulaTargets = getRulaTargets();
          if (rulaTargets.length === 0) { d.innerHTML = `<div>しかし なにも おきなかった！</div>`; setTimeout(() => updateMenuUI(), 1000); }
          else { menuState = 'rula_list'; menuIndices.rulaList = 0; updateMenuUI(); }
        } else { d.innerHTML = `<div>ＭＰが 足りない！</div>`; setTimeout(() => updateMenuUI(), 1000); }
      } else { d.innerHTML = `<div>ここでは つかえない！</div>`; setTimeout(() => updateMenuUI(), 1000); } 
    } else if (menuState === 'rula_list') {
      const target = rulaTargets[menuIndices.rulaList];
      player.mp -= SPELL_DB["ルーラ"].mp; 
      isFading = true; 
      document.getElementById('fade-overlay').classList.add('active');
      setTimeout(() => {
          currentMapId = target.mapId; player.x = target.x; player.y = target.y; player.dir = 'down';
          switchState(GAME_STATE.FIELD);
          drawField();
          document.getElementById('fade-overlay').classList.remove('active');
          setTimeout(() => { isFading = false; }, 500); 
      }, 500);
    }
  }
}

function handleCancel() {
  playSE('cancel');
  if (isFading) return; 
  if (currentState === GAME_STATE.MENU) {
    if (menuState === 'main') switchState(GAME_STATE.FIELD);
    else if (['equip_tab','item_list','magic_list'].includes(menuState)) { menuState = 'main'; updateMenuUI(); }
    else if (menuState === 'equip_list') { menuState = 'equip_tab'; updateMenuUI(); }
    else if (menuState === 'item_action') { menuState = 'item_list'; updateMenuUI(); }
    else if (menuState === 'item_use_count') { menuState = 'item_action'; updateMenuUI(); }
    else if (menuState === 'rula_list') { menuState = 'magic_list'; updateMenuUI(); }
  } else if (currentState === GAME_STATE.BATTLE && battleMenuState !== 'main' && battleMenuState !== 'end') { battleMenuState = 'main'; updateScreen(); }
  else if (currentState === GAME_STATE.SHOP) {
    if (shopState === 'select') closeShop();
    else if (shopState === 'buy') { shopState = 'select'; shopCursor = 0; document.getElementById('shop-msg').innerText = "ほかに 用はあるかね？"; updateShopUI(); }
    else if (shopState === 'sell') { shopState = 'select'; shopCursor = 1; document.getElementById('shop-msg').innerText = "ほかに 用はあるかね？"; updateShopUI(); }
  }
}

function handleDirection(dir) {
  if (isFading) return; 
  if (currentState === GAME_STATE.TITLE && hasSaveData()) { if (dir === 'up' || dir === 'down') uiSelections.title = 1 - uiSelections.title; updateScreen(); }
  else if (currentState === GAME_STATE.FIELD) {
    if (dir === 'up') movePlayer(0, -1, 'up'); if (dir === 'down') movePlayer(0, 1, 'down');
    if (dir === 'left') movePlayer(-1, 0, 'left'); if (dir === 'right') movePlayer(1, 0, 'right');
  } else if (currentState === GAME_STATE.CONFIRM) {
    if (dir === 'up' || dir === 'down') { confirmCursor = 1 - confirmCursor; updateConfirmUI(); }
  } else if (currentState === GAME_STATE.SHOP) {
    let maxCursor = 0;
    if (shopState === 'select') maxCursor = 2;
    else if (shopState === 'buy') maxCursor = currentShopItems.length;
    else if (shopState === 'sell') {
      let sellableItems = player.inventory.filter(i => (i.price && i.price > 0) || (i.sellPrice !== undefined && i.sellPrice > 0));
      maxCursor = sellableItems.length > 0 ? sellableItems.length : 0;
    }
    if (dir === 'up') shopCursor = Math.max(0, shopCursor - 1);
    if (dir === 'down') shopCursor = Math.min(maxCursor, shopCursor + 1);
    updateShopUI();
  } else if (currentState === GAME_STATE.BATTLE && !document.getElementById('battle-commands').classList.contains('hidden') && battleMenuState !== 'end') {
    if (battleMenuState === 'main') { if (dir === 'up') uiSelections.battle = Math.max(0, uiSelections.battle - 1); if (dir === 'down') uiSelections.battle = Math.min(4, uiSelections.battle + 1); }
    else { let max = battleMenuState === 'magic' ? Math.max(0, player.spells.length - 1) : Math.max(0, player.inventory.length - 1); if (dir === 'up') uiSelections.battleSub = Math.max(0, uiSelections.battleSub - 1); if (dir === 'down') uiSelections.battleSub = Math.min(max, uiSelections.battleSub + 1); }
    updateScreen();
  } else if (currentState === GAME_STATE.MENU) {
    if (menuState === 'main') { if (dir === 'up') uiSelections.menuMain = Math.max(0, uiSelections.menuMain - 1); if (dir === 'down') uiSelections.menuMain = Math.min(5, uiSelections.menuMain + 1); }
    else if (menuState === 'equip_tab') { if (dir === 'up') menuIndices.equipTab = Math.max(0, menuIndices.equipTab - 1); if (dir === 'down') menuIndices.equipTab = Math.min(3, menuIndices.equipTab + 1); }
    else if (menuState === 'equip_list') { if (dir === 'up') menuIndices.equipList = Math.max(0, menuIndices.equipList - 1); if (dir === 'down') menuIndices.equipList = Math.min(filteredItems.length, menuIndices.equipList + 1); }
    else if (menuState === 'item_list') { if (dir === 'up') menuIndices.itemList = Math.max(0, menuIndices.itemList - 1); if (dir === 'down') menuIndices.itemList = Math.min(Math.max(0, player.inventory.length - 1), menuIndices.itemList + 1); }
    else if (menuState === 'item_action') { if (dir === 'up') menuIndices.itemAction = Math.max(0, menuIndices.itemAction - 1); if (dir === 'down') menuIndices.itemAction = Math.min(1, menuIndices.itemAction + 1); }
    else if (menuState === 'item_use_count') {
      let item = player.inventory[selectedItemIndex];
      if (dir === 'left') useItemCount = Math.max(1, useItemCount - 1);
      if (dir === 'right') useItemCount = Math.min(item.count, useItemCount + 1);
      if (dir === 'up') useItemCount = Math.min(item.count, useItemCount + 10);
      if (dir === 'down') useItemCount = Math.max(1, useItemCount - 10);
      if (useItemCount > item.count) useItemCount = item.count;
    }
    else if (menuState === 'magic_list') { if (dir === 'up') menuIndices.magicList = Math.max(0, menuIndices.magicList - 1); if (dir === 'down') menuIndices.magicList = Math.min(Math.max(0, player.spells.length - 1), menuIndices.magicList + 1); }
    else if (menuState === 'rula_list') { if (dir === 'up') menuIndices.rulaList = Math.max(0, menuIndices.rulaList - 1); if (dir === 'down') menuIndices.rulaList = Math.min(Math.max(0, rulaTargets.length - 1), menuIndices.rulaList + 1); }
    updateMenuUI();
  }
}

document.getElementById('btn-ok').addEventListener('pointerdown', (e) => { e.preventDefault(); handleOk(); });
document.getElementById('btn-cancel').addEventListener('pointerdown', (e) => { e.preventDefault(); handleCancel(); });
document.getElementById('btn-menu').addEventListener('pointerdown', (e) => { e.preventDefault(); if (currentState === GAME_STATE.FIELD && !isFading) { uiSelections.menuMain = 0; menuState = 'main'; switchState(GAME_STATE.MENU); } });
['up', 'down', 'left', 'right'].forEach(dir => document.getElementById('btn-' + dir).addEventListener('pointerdown', (e) => { e.preventDefault(); handleDirection(dir); }));
window.addEventListener('keydown', (e) => { if (e.key === 'ArrowUp') handleDirection('up'); if (e.key === 'ArrowDown') handleDirection('down'); if (e.key === 'ArrowLeft') handleDirection('left'); if (e.key === 'ArrowRight') handleDirection('right'); if (e.key === 'Enter' || e.key === 'z') handleOk(); if (e.key === 'Escape' || e.key === 'x') handleCancel(); });

window.onload = preloadImagesAndInit;
</script>
